apiVersion: v1
kind: ConfigMap
metadata:
  name: graphreview-config
data:
  BUS_BACKEND: kafka
  KAFKA_BOOTSTRAP: graphreview-kafka-bootstrap:9092
  STATE_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  CONTEXT_SERVICE_URL: http://context:8001
  LLM_BACKEND: anthropic
  AGENT_MODEL: claude-opus-5-5
  CRITIC_MODEL: claude-opus-5-5
  EXPECTED_AGENTS: '["static","reviewer","security","tests"]'
  AGGREGATION_TIMEOUT_S: "300"
  LOG_JSON: "true"
  METRICS_PORT: "9100"
# Secret `graphreview-secrets` (ANTHROPIC_API_KEY, GITHUB_TOKEN, GITHUB_WEBHOOK_SECRET) is created
# by the overlay's secretGenerator (dev) or an external secret manager (prod).
