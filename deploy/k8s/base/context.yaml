apiVersion: apps/v1
kind: Deployment
metadata:
  name: context
  labels: { app: context, tier: app }
spec:
  replicas: 2
  selector: { matchLabels: { app: context } }
  template:
    metadata:
      labels: { app: context, tier: app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics/"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: context
          image: graphreview-rag
          args: ["context", "--port", "8001"]
          ports:
            - { name: http, containerPort: 8001 }
          envFrom:
            - configMapRef: { name: graphreview-config }
            - secretRef: { name: graphreview-secrets, optional: true }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # ONNX runtime / HF hub write lock files next to the baked models
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: context
spec:
  selector: { app: context }
  ports: [{ name: http, port: 8001, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: context
spec:
  minAvailable: 1
  selector: { matchLabels: { app: context } }
