# Requires the Strimzi operator (>= 1.0, `kafka.strimzi.io/v1` API) watching this namespace.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: graphreview
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: graphreview
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      message.max.bytes: 8388608
  entityOperator:
    topicOperator: {}
---
# Six partitions per pipeline topic = the ceiling for agent replicas per consumer group.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: pr-review-requested
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: pr.review.requested
  partitions: 6
  replicas: 1
  config: { retention.ms: 604800000, max.message.bytes: 8388608 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: review-agent-results
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: review.agent.results
  partitions: 6
  replicas: 1
  config: { retention.ms: 604800000, max.message.bytes: 8388608 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: review-aggregated
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: review.aggregated
  partitions: 6
  replicas: 1
  config: { retention.ms: 604800000, max.message.bytes: 8388608 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: review-completed
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: review.completed
  partitions: 6
  replicas: 1
  config: { retention.ms: 604800000, max.message.bytes: 8388608 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: repo-index-requested
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: repo.index.requested
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: repo-indexed
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: repo.indexed
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: review-dlq
  labels: { strimzi.io/cluster: graphreview }
spec:
  topicName: review.dlq
  partitions: 1
  replicas: 1
  config: { retention.ms: 2592000000, max.message.bytes: 8388608 }
