apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-static
spec:
  scaleTargetRef: { name: agent-static }
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 300 }
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: graphreview-kafka-bootstrap.graphreview.svc:9092
        consumerGroup: agent-static
        topic: pr.review.requested
        lagThreshold: "5"
        offsetResetPolicy: earliest
---
