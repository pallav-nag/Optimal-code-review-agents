apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: graphreview
labels:
  - pairs:
      app.kubernetes.io/part-of: graphreview
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - kafka.yaml
  - redis.yaml
  - qdrant.yaml
  - context.yaml
  - indexer.yaml
  - gateway.yaml
  - agents.yaml
  - pipeline.yaml
  - autoscaling.yaml
  - keda.yaml
  - networkpolicy.yaml
images:
  - name: graphreview-core
    newTag: dev
  - name: graphreview-rag
    newTag: dev
