# kind / local cluster: single replicas, images loaded with `kind load`, gateway on NodePort 30080.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
secretGenerator:
  - name: graphreview-secrets
    namespace: graphreview
    envs: [secrets.env]   # cp secrets.env.example secrets.env
configMapGenerator:
  - name: graphreview-config
    namespace: graphreview
    behavior: merge
    envs: [config.env]
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: { kind: Deployment, name: "gateway|context" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # laptop-sized requests so a burst can scale every agent tier to 6 replicas on one kind node
  - target: { kind: Deployment, name: "agent-.*|aggregator|critic|publisher|gateway" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: { cpu: 25m, memory: 96Mi }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target: { kind: Service, name: gateway }
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
