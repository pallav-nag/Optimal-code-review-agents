apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: graphreview
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx  # set to your controller's class
  tls:
    - hosts: [review.example.com]
      secretName: gateway-tls
  rules:
    - host: review.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8080 } } }
