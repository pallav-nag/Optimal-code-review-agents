global:
  scrape_interval: 10s

scrape_configs:
  - job_name: http-services
    metrics_path: /metrics/
    static_configs:
      - targets: ["gateway:8080", "context:8001"]

  # Workers expose metrics on :9100. Compose DNS returns every replica's IP,
  # so scaled services (agent-reviewer ×2) are all scraped.
  - job_name: workers
    dns_sd_configs:
      - names: [agent-static, agent-reviewer, agent-security, agent-tests, aggregator, critic, publisher, indexer]
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: compose_service  # metrics carry their own `service` label
