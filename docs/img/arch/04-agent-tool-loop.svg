<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 422" width="992" height="422" role="img" aria-label="Agent loop: build the prompt, call Claude, then either run tools and loop, parse the final JSON findings, or record an error result."><style>svg{--paper:#f5f6f3;--panel:#ffffff;--wash:#eceee9;--rule:#d6dbd4;--ink:#17201c;--ink-2:#46524c;--ink-3:#6a756f;--kafka:#0b6973;--kafka-wash:#dcefef;--llm:#9a4c0c;--llm-wash:#fbece0;--store:#5447a6;--store-wash:#ebe9f8;--ok:#1c7a3d;--bad:#b42318;--bad-wash:#fbe9e7;--body:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){svg{--paper:#101513;--panel:#161d1a;--wash:#1d2521;--rule:#2c3631;--ink:#e4eae6;--ink-2:#b3beb8;--ink-3:#8a958f;--kafka:#5cc6d0;--kafka-wash:#11292c;--llm:#eba35f;--llm-wash:#2c2016;--store:#a99ef0;--store-wash:#211f34;--ok:#5cc785;--bad:#ff8b80;--bad-wash:#331a18;}}.bg{fill:var(--panel);stroke:var(--rule)}svg text { font-family: var(--body); }.d-box { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.2; }.d-llm { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1.2; }.d-store { fill: var(--store-wash); stroke: var(--store); stroke-width: 1.2; }.d-cell { fill: var(--kafka-wash); stroke: var(--kafka); stroke-width: 1.2; }.d-msg { fill: var(--kafka); }.d-bad { fill: var(--bad-wash); stroke: var(--bad); stroke-width: 1.2; }.d-group { fill: transparent; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 5 4; }.d-loop { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1; stroke-dasharray: 3 3; }.d-pill { fill: var(--store-wash); stroke: var(--store); stroke-width: 1; }.t-title { fill: var(--ink); font-size: 13.5px; font-weight: 600; }.t-sub { fill: var(--ink-2); font-size: 11.5px; }.t-note { fill: var(--ink-3); font-size: 11px; }.t-mono { font-family: var(--mono); }.t-kafka { fill: var(--kafka); font-family: var(--mono); font-size: 11.5px; font-weight: 500; }.t-kafka-s { fill: var(--kafka); font-family: var(--mono); }.t-store { fill: var(--store); font-size: 11px; font-weight: 500; }.t-ok { fill: var(--ok); font-size: 11.5px; font-weight: 600; }.t-groupt { fill: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .02em; }.t-lane { fill: var(--ink); font-size: 11.5px; font-weight: 600; }.t-seq { fill: var(--ink-2); font-size: 10.5px; }.t-pill { fill: var(--store); font-size: 10.5px; font-weight: 600; }.t-axis { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }.e { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }.e-kafka { stroke: var(--kafka); stroke-width: 2; }.e-tool { stroke-dasharray: 5 4; }.e-llm { stroke: var(--llm); stroke-dasharray: 5 4; }.e-store { stroke: var(--store); }.e-ok { stroke: var(--ok); }.e-bad { stroke: var(--bad); }.e-ret { stroke-dasharray: 3 3; stroke: var(--ink-3); }.e-faded { stroke: var(--ink-3); stroke-dasharray: 2 3; }.m-ink { fill: var(--ink-2); } .m-kafka { fill: var(--kafka); } .m-llm { fill: var(--llm); }.m-bad { fill: var(--bad); } .m-store { fill: var(--store); } .m-ok { fill: var(--ok); }.lifeline { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 4; }.ring { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 5 5; }.n-hit { fill: var(--llm); stroke: var(--panel); stroke-width: 3; }.n-d1, .n-d2 { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.n-t { fill: var(--ok); stroke: var(--panel); stroke-width: 2; }.n-out { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }.grid { stroke: var(--rule); stroke-width: 1; }.axis { stroke: var(--ink-3); stroke-width: 1; }.series { fill: none; stroke: var(--kafka); stroke-width: 2; stroke-linejoin: round; }.pt { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.pt:hover { r: 6.5; }</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="421" rx="12"/><defs><marker id="f4i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="f4k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-kafka"/></marker><marker id="f4l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-llm"/></marker><marker id="f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-bad"/></marker><marker id="f4s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-store"/></marker><marker id="f4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ok"/></marker></defs><rect x="20" y="110" width="180" height="90" rx="7" class="d-box"/><text x="110.0" y="137.5" class="t-title" text-anchor="middle">Build prompt</text><text x="110.0" y="153.5" class="t-sub" text-anchor="middle">PR title + description</text><text x="110.0" y="168.5" class="t-sub" text-anchor="middle">diff with line numbers</text><text x="110.0" y="183.5" class="t-sub" text-anchor="middle">graph impact report</text><path d="M200 155H248" class="e " marker-end="url(#f4i)"/><rect x="250" y="110" width="180" height="90" rx="7" class="d-llm"/><text x="340.0" y="137.5" class="t-title" text-anchor="middle">Call Claude</text><text x="340.0" y="153.5" class="t-sub" text-anchor="middle">role&#x27;s system prompt</text><text x="340.0" y="168.5" class="t-sub" text-anchor="middle">5 strict tools + JSON schema</text><text x="340.0" y="183.5" class="t-sub" text-anchor="middle">effort · prompt cache</text><path d="M430 155H488" class="e e-llm" marker-end="url(#f4l)"/><path d="M490 155L550 110L610 155L550 200Z" class="d-box"/><text x="550" y="152" class="t-title" text-anchor="middle">stop_reason</text><text x="550" y="168" class="t-sub" text-anchor="middle">?</text><path d="M610 155H668" class="e e-ok" marker-end="url(#f4o)"/><text x="639" y="146" class="t-note" text-anchor="middle">end_turn</text><rect x="670" y="110" width="132" height="90" rx="7" class="d-box"/><text x="736.0" y="145.0" class="t-title" text-anchor="middle">Parse findings</text><text x="736.0" y="161.0" class="t-sub" text-anchor="middle">schema-valid JSON</text><text x="736.0" y="176.0" class="t-sub" text-anchor="middle">→ Finding[]</text><path d="M802 155H823" class="e " marker-end="url(#f4i)"/><rect x="825" y="110" width="120" height="90" rx="7" class="d-box"/><text x="885.0" y="137.5" class="t-title" text-anchor="middle">AgentResult</text><text x="885.0" y="153.5" class="t-sub" text-anchor="middle">findings · usage</text><text x="885.0" y="168.5" class="t-sub" text-anchor="middle">tool counts · time</text><text x="885.0" y="183.5" class="t-sub" text-anchor="middle">→ Kafka</text><path d="M550 200V278" class="e " marker-end="url(#f4i)"/><text x="560" y="244" class="t-note" text-anchor="start">tool_use</text><rect x="460" y="280" width="180" height="90" rx="7" class="d-box"/><text x="550.0" y="307.5" class="t-title" text-anchor="middle">Run tool calls</text><text x="550.0" y="323.5" class="t-sub" text-anchor="middle">all at once (asyncio.gather)</text><text x="550.0" y="338.5" class="t-sub" text-anchor="middle">→ context service</text><text x="550.0" y="353.5" class="t-sub" text-anchor="middle">errors become is_error</text><path d="M460 325H432" class="e " marker-end="url(#f4i)"/><rect x="250" y="280" width="180" height="90" rx="7" class="d-box"/><text x="340.0" y="307.5" class="t-title" text-anchor="middle">Append to history</text><text x="340.0" y="323.5" class="t-sub" text-anchor="middle">assistant turn, verbatim</text><text x="340.0" y="338.5" class="t-sub" text-anchor="middle">+ every tool_result</text><text x="340.0" y="353.5" class="t-sub" text-anchor="middle">in one user message</text><path d="M340 280V202" class="e " marker-end="url(#f4i)"/><text x="350" y="244" class="t-note" text-anchor="start">next turn</text><text x="350" y="259" class="t-note" text-anchor="start">(last turn: tools off)</text><path d="M550 110V44H668" class="e e-bad" marker-end="url(#f4b)"/><text x="560" y="98" class="t-note" text-anchor="start">refusal · max_tokens · API error</text><rect x="670" y="14" width="275" height="60" rx="7" class="d-bad"/><text x="807.5" y="41.5" class="t-title" text-anchor="middle">AgentResult with error</text><text x="807.5" y="57.5" class="t-sub" text-anchor="middle">aggregator records it · review still completes</text></svg>
