<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 262" width="992" height="262" role="img" aria-label="Indexing: one checkout feeds two lanes. The graph lane writes a code graph to Redis; the chunk lane embeds code and docs into Qdrant."><style>svg{--paper:#f5f6f3;--panel:#ffffff;--wash:#eceee9;--rule:#d6dbd4;--ink:#17201c;--ink-2:#46524c;--ink-3:#6a756f;--kafka:#0b6973;--kafka-wash:#dcefef;--llm:#9a4c0c;--llm-wash:#fbece0;--store:#5447a6;--store-wash:#ebe9f8;--ok:#1c7a3d;--bad:#b42318;--bad-wash:#fbe9e7;--body:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){svg{--paper:#101513;--panel:#161d1a;--wash:#1d2521;--rule:#2c3631;--ink:#e4eae6;--ink-2:#b3beb8;--ink-3:#8a958f;--kafka:#5cc6d0;--kafka-wash:#11292c;--llm:#eba35f;--llm-wash:#2c2016;--store:#a99ef0;--store-wash:#211f34;--ok:#5cc785;--bad:#ff8b80;--bad-wash:#331a18;}}.bg{fill:var(--panel);stroke:var(--rule)}svg text { font-family: var(--body); }.d-box { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.2; }.d-llm { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1.2; }.d-store { fill: var(--store-wash); stroke: var(--store); stroke-width: 1.2; }.d-cell { fill: var(--kafka-wash); stroke: var(--kafka); stroke-width: 1.2; }.d-msg { fill: var(--kafka); }.d-bad { fill: var(--bad-wash); stroke: var(--bad); stroke-width: 1.2; }.d-group { fill: transparent; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 5 4; }.d-loop { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1; stroke-dasharray: 3 3; }.d-pill { fill: var(--store-wash); stroke: var(--store); stroke-width: 1; }.t-title { fill: var(--ink); font-size: 13.5px; font-weight: 600; }.t-sub { fill: var(--ink-2); font-size: 11.5px; }.t-note { fill: var(--ink-3); font-size: 11px; }.t-mono { font-family: var(--mono); }.t-kafka { fill: var(--kafka); font-family: var(--mono); font-size: 11.5px; font-weight: 500; }.t-kafka-s { fill: var(--kafka); font-family: var(--mono); }.t-store { fill: var(--store); font-size: 11px; font-weight: 500; }.t-ok { fill: var(--ok); font-size: 11.5px; font-weight: 600; }.t-groupt { fill: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .02em; }.t-lane { fill: var(--ink); font-size: 11.5px; font-weight: 600; }.t-seq { fill: var(--ink-2); font-size: 10.5px; }.t-pill { fill: var(--store); font-size: 10.5px; font-weight: 600; }.t-axis { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }.e { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }.e-kafka { stroke: var(--kafka); stroke-width: 2; }.e-tool { stroke-dasharray: 5 4; }.e-llm { stroke: var(--llm); stroke-dasharray: 5 4; }.e-store { stroke: var(--store); }.e-ok { stroke: var(--ok); }.e-bad { stroke: var(--bad); }.e-ret { stroke-dasharray: 3 3; stroke: var(--ink-3); }.e-faded { stroke: var(--ink-3); stroke-dasharray: 2 3; }.m-ink { fill: var(--ink-2); } .m-kafka { fill: var(--kafka); } .m-llm { fill: var(--llm); }.m-bad { fill: var(--bad); } .m-store { fill: var(--store); } .m-ok { fill: var(--ok); }.lifeline { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 4; }.ring { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 5 5; }.n-hit { fill: var(--llm); stroke: var(--panel); stroke-width: 3; }.n-d1, .n-d2 { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.n-t { fill: var(--ok); stroke: var(--panel); stroke-width: 2; }.n-out { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }.grid { stroke: var(--rule); stroke-width: 1; }.axis { stroke: var(--ink-3); stroke-width: 1; }.series { fill: none; stroke: var(--kafka); stroke-width: 2; stroke-linejoin: round; }.pt { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.pt:hover { r: 6.5; }</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="261" rx="12"/><defs><marker id="f5i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="f5k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-kafka"/></marker><marker id="f5l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-llm"/></marker><marker id="f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-bad"/></marker><marker id="f5s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-store"/></marker><marker id="f5o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ok"/></marker></defs><rect x="20" y="70" width="150" height="90" rx="7" class="d-box"/><text x="95.0" y="105.0" class="t-title" text-anchor="middle">repo checkout</text><text x="95.0" y="121.0" class="t-sub" text-anchor="middle">default branch</text><text x="95.0" y="136.0" class="t-sub" text-anchor="middle">git clone --depth 1</text><path d="M170 100H196V50H228" class="e " marker-end="url(#f5i)"/><path d="M170 130H196V180H228" class="e " marker-end="url(#f5i)"/><rect x="230" y="14" width="210" height="72" rx="7" class="d-box"/><text x="335.0" y="40.0" class="t-title" text-anchor="middle">graph builder</text><text x="335.0" y="56.0" class="t-sub" text-anchor="middle">graphify extract --code-only</text><text x="335.0" y="71.0" class="t-sub" text-anchor="middle">fallback: Python AST builder</text><path d="M440 50H478" class="e " marker-end="url(#f5i)"/><rect x="480" y="14" width="190" height="72" rx="7" class="d-box"/><text x="575.0" y="40.0" class="t-title" text-anchor="middle">graph.json</text><text x="575.0" y="56.0" class="t-sub" text-anchor="middle">nodes: functions, classes, files</text><text x="575.0" y="71.0" class="t-sub" text-anchor="middle">edges: calls, imports, inherits</text><path d="M670 50H708" class="e e-store" marker-end="url(#f5s)"/><rect x="710" y="14" width="230" height="72" rx="7" class="d-store"/><text x="825.0" y="40.0" class="t-title" text-anchor="middle">Redis</text><text x="825.0" y="56.0" class="t-sub" text-anchor="middle">graph:{repo} (gzip) + version</text><text x="825.0" y="71.0" class="t-sub" text-anchor="middle">sample app: 60 nodes · 147 edges</text><rect x="230" y="144" width="210" height="72" rx="7" class="d-box"/><text x="335.0" y="170.0" class="t-title" text-anchor="middle">chunker</text><text x="335.0" y="186.0" class="t-sub" text-anchor="middle">functions / classes / module gaps</text><text x="335.0" y="201.0" class="t-sub" text-anchor="middle">markdown split by heading</text><path d="M440 180H478" class="e " marker-end="url(#f5i)"/><rect x="480" y="144" width="190" height="72" rx="7" class="d-box"/><text x="575.0" y="170.0" class="t-title" text-anchor="middle">embedder</text><text x="575.0" y="186.0" class="t-sub" text-anchor="middle">dense: BGE-small, 384-d</text><text x="575.0" y="201.0" class="t-sub" text-anchor="middle">sparse: BM25 terms</text><path d="M670 180H708" class="e e-store" marker-end="url(#f5s)"/><rect x="710" y="144" width="230" height="72" rx="7" class="d-store"/><text x="825.0" y="170.0" class="t-title" text-anchor="middle">Qdrant</text><text x="825.0" y="186.0" class="t-sub" text-anchor="middle">one point per chunk</text><text x="825.0" y="201.0" class="t-sub" text-anchor="middle">sample app: 54 chunks</text></svg>
