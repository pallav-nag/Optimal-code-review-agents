" class="t-sub t-mono" text-anchor="middle">1  CONTRIBUTING.md · Money</text><text x="430.0" y="181.5" class="t-sub t-mono" text-anchor="middle">2  CONTRIBUTING.md · Passwords</text><text x="430.0" y="196.5" class="t-sub t-mono" text-anchor="middle">3  models.py · Product</text><path d="M580 52H610V100H638" class="e " marker-end="url(#f7i)"/><path d="M580 168H610V120H638" class="e " marker-end="url(#f7i)"/><rect x="640" y="60" width="300" height="100" rx="7" class="d-store"/><text x="790.0" y="92.5" class="t-title" text-anchor="middle">reciprocal rank fusion</text><text x="790.0" y="108.5" class="t-sub t-mono" text-anchor="middle">score = Σ 1 / (k + rank)</text><text x="790.0" y="123.5" class="t-sub" text-anchor="middle">ranked high in both → wins</text><text x="790.0" y="138.5" class="t-sub" text-anchor="middle">returns path:lines + text</text></svg>
