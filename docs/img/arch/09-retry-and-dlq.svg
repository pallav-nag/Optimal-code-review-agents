<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 282" width="992" height="282" role="img" aria-label="Message handling: success commits the offset; an exception retries up to three times with backoff, then the message goes to the dead-letter topic and the offset is committed."><style>svg{--paper:#f5f6f3;--panel:#ffffff;--wash:#eceee9;--rule:#d6dbd4;--ink:#17201c;--ink-2:#46524c;--ink-3:#6a756f;--kafka:#0b6973;--kafka-wash:#dcefef;--llm:#9a4c0c;--llm-wash:#fbece0;--store:#5447a6;--store-wash:#ebe9f8;--ok:#1c7a3d;--bad:#b42318;--bad-wash:#fbe9e7;--body:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){svg{--paper:#101513;--panel:#161d1a;--wash:#1d2521;--rule:#2c3631;--ink:#e4eae6;--ink-2:#b3beb8;--ink-3:#8a958f;--kafka:#5cc6d0;--kafka-wash:#11292c;--llm:#eba35f;--llm-wash:#2c2016;--store:#a99ef0;--store-wash:#211f34;--ok:#5cc785;--bad:#ff8b80;--bad-wash:#331a18;}}.bg{fill:var(--panel);stroke:var(--rule)}svg text { font-family: var(--body); }.d-box { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.2; }.d-llm { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1.2; }.d-store { fill: var(--store-wash); stroke: var(--store); stroke-width: 1.2; }.d-cell { fill: var(--kafka-wash); stroke: var(--kafka); stroke-width: 1.2; }.d-msg { fill: var(--kafka); }.d-bad { fill: var(--bad-wash); stroke: var(--bad); stroke-width: 1.2; }.d-group { fill: transparent; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 5 4; }.d-loop { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1; stroke-dasharray: 3 3; }.d-pill { fill: var(--store-wash); stroke: var(--store); stroke-width: 1; }.t-title { fill: var(--ink); font-size: 13.5px; font-weight: 600; }.t-sub { fill: var(--ink-2); font-size: 11.5px; }.t-note { fill: var(--ink-3); font-size: 11px; }.t-mono { font-family: var(--mono); }.t-kafka { fill: var(--kafka); font-family: var(--mono); font-size: 11.5px; font-weight: 500; }.t-kafka-s { fill: var(--kafka); font-family: var(--mono); }.t-store { fill: var(--store); font-size: 11px; font-weight: 500; }.t-ok { fill: var(--ok); font-size: 11.5px; font-weight: 600; }.t-groupt { fill: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .02em; }.t-lane { fill: var(--ink); font-size: 11.5px; font-weight: 600; }.t-seq { fill: var(--ink-2); font-size: 10.5px; }.t-pill { fill: var(--store); font-size: 10.5px; font-weight: 600; }.t-axis { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }.e { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }.e-kafka { stroke: var(--kafka); stroke-width: 2; }.e-tool { stroke-dasharray: 5 4; }.e-llm { stroke: var(--llm); stroke-dasharray: 5 4; }.e-store { stroke: var(--store); }.e-ok { stroke: var(--ok); }.e-bad { stroke: var(--bad); }.e-ret { stroke-dasharray: 3 3; stroke: var(--ink-3); }.e-faded { stroke: var(--ink-3); stroke-dasharray: 2 3; }.m-ink { fill: var(--ink-2); } .m-kafka { fill: var(--kafka); } .m-llm { fill: var(--llm); }.m-bad { fill: var(--bad); } .m-store { fill: var(--store); } .m-ok { fill: var(--ok); }.lifeline { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 4; }.ring { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 5 5; }.n-hit { fill: var(--llm); stroke: var(--panel); stroke-width: 3; }.n-d1, .n-d2 { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.n-t { fill: var(--ok); stroke: var(--panel); stroke-width: 2; }.n-out { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }.grid { stroke: var(--rule); stroke-width: 1; }.axis { stroke: var(--ink-3); stroke-width: 1; }.series { fill: none; stroke: var(--kafka); stroke-width: 2; stroke-linejoin: round; }.pt { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.pt:hover { r: 6.5; }</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="281" rx="12"/><defs><marker id="f9i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="f9k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-kafka"/></marker><marker id="f9l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-llm"/></marker><marker id="f9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-bad"/></marker><marker id="f9s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-store"/></marker><marker id="f9o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ok"/></marker></defs><rect x="20" y="40" width="160" height="60" rx="7" class="d-box"/><text x="100.0" y="67.5" class="t-title" text-anchor="middle">poll one message</text><text x="100.0" y="83.5" class="t-sub" text-anchor="middle">max_poll_records = 1</text><path d="M180 70H218" class="e " marker-end="url(#f9i)"/><rect x="220" y="40" width="170" height="60" rx="7" class="d-box"/><text x="305.0" y="67.5" class="t-title" text-anchor="middle">run handler</text><text x="305.0" y="83.5" class="t-sub" text-anchor="middle">agent, aggregator, …</text><path d="M390 70H758" class="e e-ok" marker-end="url(#f9o)"/><text x="575" y="62" class="t-note" text-anchor="middle">success</text><rect x="760" y="40" width="180" height="60" rx="7" class="d-box"/><text x="850.0" y="67.5" class="t-title" text-anchor="middle">commit offset</text><text x="850.0" y="83.5" class="t-sub" text-anchor="middle">only after success</text><path d="M305 100V148" class="e e-bad" marker-end="url(#f9b)"/><text x="315" y="128" class="t-note" text-anchor="start">exception</text><path d="M235 190L305 150L375 190L305 230Z" class="d-box"/><text x="305" y="186" class="t-title" text-anchor="middle">attempt</text><text x="305" y="202" class="t-sub" text-anchor="middle">&lt; 3 ?</text><path d="M235 190H182" class="e " marker-end="url(#f9i)"/><text x="208" y="182" class="t-note" text-anchor="middle">yes</text><rect x="30" y="162" width="150" height="56" rx="7" class="d-box"/><text x="105.0" y="187.5" class="t-title" text-anchor="middle">back off</text><text x="105.0" y="203.5" class="t-sub" text-anchor="middle">2 s, then 4 s</text><path d="M105 162V130H260V102" class="e " marker-end="url(#f9i)"/><path d="M375 190H438" class="e e-bad" marker-end="url(#f9b)"/><text x="406" y="182" class="t-note" text-anchor="middle">no</text><rect x="440" y="160" width="260" height="60" rx="7" class="d-bad"/><text x="570.0" y="187.5" class="t-title" text-anchor="middle">publish to review.dlq</text><text x="570.0" y="203.5" class="t-sub" text-anchor="middle">headers: origin_topic, service, error</text><path d="M700 190H850V102" class="e " marker-end="url(#f9i)"/></svg>
