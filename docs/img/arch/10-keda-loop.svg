<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 202" width="992" height="202" role="img" aria-label="KEDA loop: consumer lag in Kafka drives the desired replica count, capped at six, and the added pods drain the lag."><style>svg{--paper:#f5f6f3;--panel:#ffffff;--wash:#eceee9;--rule:#d6dbd4;--ink:#17201c;--ink-2:#46524c;--ink-3:#6a756f;--kafka:#0b6973;--kafka-wash:#dcefef;--llm:#9a4c0c;--llm-wash:#fbece0;--store:#5447a6;--store-wash:#ebe9f8;--ok:#1c7a3d;--bad:#b42318;--bad-wash:#fbe9e7;--body:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){svg{--paper:#101513;--panel:#161d1a;--wash:#1d2521;--rule:#2c3631;--ink:#e4eae6;--ink-2:#b3beb8;--ink-3:#8a958f;--kafka:#5cc6d0;--kafka-wash:#11292c;--llm:#eba35f;--llm-wash:#2c2016;--store:#a99ef0;--store-wash:#211f34;--ok:#5cc785;--bad:#ff8b80;--bad-wash:#331a18;}}.bg{fill:var(--panel);stroke:var(--rule)}svg text { font-family: var(--body); }.d-box { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.2; }.d-llm { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1.2; }.d-store { fill: var(--store-wash); stroke: var(--store); stroke-width: 1.2; }.d-cell { fill: var(--kafka-wash); stroke: var(--kafka); stroke-width: 1.2; }.d-msg { fill: var(--kafka); }.d-bad { fill: var(--bad-wash); stroke: var(--bad); stroke-width: 1.2; }.d-group { fill: transparent; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 5 4; }.d-loop { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1; stroke-dasharray: 3 3; }.d-pill { fill: var(--store-wash); stroke: var(--store); stroke-width: 1; }.t-title { fill: var(--ink); font-size: 13.5px; font-weight: 600; }.t-sub { fill: var(--ink-2); font-size: 11.5px; }.t-note { fill: var(--ink-3); font-size: 11px; }.t-mono { font-family: var(--mono); }.t-kafka { fill: var(--kafka); font-family: var(--mono); font-size: 11.5px; font-weight: 500; }.t-kafka-s { fill: var(--kafka); font-family: var(--mono); }.t-store { fill: var(--store); font-size: 11px; font-weight: 500; }.t-ok { fill: var(--ok); font-size: 11.5px; font-weight: 600; }.t-groupt { fill: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .02em; }.t-lane { fill: var(--ink); font-size: 11.5px; font-weight: 600; }.t-seq { fill: var(--ink-2); font-size: 10.5px; }.t-pill { fill: var(--store); font-size: 10.5px; font-weight: 600; }.t-axis { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }.e { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }.e-kafka { stroke: var(--kafka); stroke-width: 2; }.e-tool { stroke-dasharray: 5 4; }.e-llm { stroke: var(--llm); stroke-dasharray: 5 4; }.e-store { stroke: var(--store); }.e-ok { stroke: var(--ok); }.e-bad { stroke: var(--bad); }.e-ret { stroke-dasharray: 3 3; stroke: var(--ink-3); }.e-faded { stroke: var(--ink-3); stroke-dasharray: 2 3; }.m-ink { fill: var(--ink-2); } .m-kafka { fill: var(--kafka); } .m-llm { fill: var(--llm); }.m-bad { fill: var(--bad); } .m-store { fill: var(--store); } .m-ok { fill: var(--ok); }.lifeline { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 4; }.ring { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 5 5; }.n-hit { fill: var(--llm); stroke: var(--panel); stroke-width: 3; }.n-d1, .n-d2 { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.n-t { fill: var(--ok); stroke: var(--panel); stroke-width: 2; }.n-out { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }.grid { stroke: var(--rule); stroke-width: 1; }.axis { stroke: var(--ink-3); stroke-width: 1; }.series { fill: none; stroke: var(--kafka); stroke-width: 2; stroke-linejoin: round; }.pt { fill: var(--kafka); stroke: var(--panel); stroke-width: 2; }.pt:hover { r: 6.5; }</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="201" rx="12"/><defs><marker id="fai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="fak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-kafka"/></marker><marker id="fal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-llm"/></marker><marker id="fab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-bad"/></marker><marker id="fas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-store"/></marker><marker id="fao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ok"/></marker></defs><rect x="20" y="30" width="190" height="72" rx="7" class="d-cell"/><text x="115.0" y="56.0" class="t-title" text-anchor="middle">Kafka</text><text x="115.0" y="72.0" class="t-sub" text-anchor="middle">consumer-group lag</text><text x="115.0" y="87.0" class="t-sub" text-anchor="middle">messages not yet committed</text><path d="M210 66H258" class="e " marker-end="url(#fai)"/><text x="234" y="58" class="t-note" text-anchor="middle">read</text><rect x="260" y="30" width="210" height="72" rx="7" class="d-box"/><text x="365.0" y="56.0" class="t-title" text-anchor="middle">KEDA scaler</text><text x="365.0" y="72.0" class="t-sub" text-anchor="middle">desired = lag ÷ threshold</text><text x="365.0" y="87.0" class="t-sub" text-anchor="middle">threshold 2 (Claude agents)</text><path d="M470 66H518" class="e " marker-end="url(#fai)"/><rect x="520" y="30" width="190" height="72" rx="7" class="d-box"/><text x="615.0" y="56.0" class="t-title" text-anchor="middle">HPA</text><text x="615.0" y="72.0" class="t-sub" text-anchor="middle">min 1 · max 6 replicas</text><text x="615.0" y="87.0" class="t-sub" text-anchor="middle">6 = partition count</text><path d="M710 66H758" class="e " marker-end="url(#fai)"/><rect x="760" y="30" width="180" height="72" rx="7" class="d-llm"/><text x="850.0" y="56.0" class="t-title" text-anchor="middle">Deployment</text><text x="850.0" y="72.0" class="t-sub" text-anchor="middle">agent pods</text><text x="850.0" y="87.0" class="t-sub" text-anchor="middle">join the consumer group</text><path d="M850 102V140H115V104" class="e e-kafka" marker-end="url(#fak)"/><text x="480" y="158" class="t-note" text-anchor="middle">more consumers drain the lag; after 300 s quiet KEDA scales back to 1</text></svg>
