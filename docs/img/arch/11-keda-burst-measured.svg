<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 962 262" width="962" height="262" role="img" aria-label="Measured on kind: replicas rose from 1 to 5 within 10 seconds and 6 within 20 seconds; lag per replica fell from 12 to 0 by about 50 seconds."><style>svg{--paper:#f5f6f3;--panel:#ffffff;--wash:#eceee9;--rule:#d6dbd4;--ink:#17201c;--ink-2:#46524c;--ink-3:#6a756f;--kafka:#0b6973;--kafka-wash:#dcefef;--llm:#9a4c0c;--llm-wash:#fbece0;--store:#5447a6;--store-wash:#ebe9f8;--ok:#1c7a3d;--bad:#b42318;--bad-wash:#fbe9e7;--body:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){svg{--paper:#101513;--panel:#161d1a;--wash:#1d2521;--rule:#2c3631;--ink:#e4eae6;--ink-2:#b3beb8;--ink-3:#8a958f;--kafka:#5cc6d0;--kafka-wash:#11292c;--llm:#eba35f;--llm-wash:#2c2016;--store:#a99ef0;--store-wash:#211f34;--ok:#5cc785;--bad:#ff8b80;--bad-wash:#331a18;}}.bg{fill:var(--panel);stroke:var(--rule)}svg text { font-family: var(--body); }.d-box { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.2; }.d-llm { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1.2; }.d-store { fill: var(--store-wash); stroke: var(--store); stroke-width: 1.2; }.d-cell { fill: var(--kafka-wash); stroke: var(--kafka); stroke-width: 1.2; }.d-msg { fill: var(--kafka); }.d-bad { fill: var(--bad-wash); stroke: var(--bad); stroke-width: 1.2; }.d-group { fill: transparent; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 5 4; }.d-loop { fill: var(--llm-wash); stroke: var(--llm); stroke-width: 1; stroke-dasharray: 3 3; }.d-pill { fill: var(--store-wash); stroke: var(--store); stroke-width: 1; }.t-title { fill: var(--ink); font-size: 13.5px; font-weight: 600; }.t-sub { fill: var(--ink-2); font-size: 11.5px; }.t-note { fill: var(--ink-3); font-size: 11px; }.t-mono { font-family: var(--mono); }.t-kafka { fill: var(--kafka); font-family: var(--mono); font-size: 11.5px; font-weight: 500; }.t-kafka-s 