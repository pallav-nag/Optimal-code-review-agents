[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphreview"
version = "0.2.0"
description = "Event-driven multi-agent PR review with GraphRAG (Graphify code graph + hybrid vector search) on Kafka and Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiokafka>=0.11",
    "redis>=5.0",
    "anthropic>=1.11",
    "prometheus-client>=0.20",
    "networkx>=3.3",
]

[project.optional-dependencies]
# Retrieval: vector store + local embeddings (context service, indexer)
rag = ["qdrant-client>=1.12", "fastembed>=0.4"]
# Code graph extraction (indexer). Falls back to the built-in AST builder if absent.
graph = ["graphifyy>=0.9"]
# Static analysis agent
static = ["ruff>=0.6"]
# Expose the retrieval tools to Claude Code / Cursor over MCP
mcp = ["mcp>=2,<3"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "qdrant-client>=1.12",
]
all = ["graphreview[rag,graph,static,mcp]"]

[project.scripts]
graphreview = "graphreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphreview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert in tests
    "S603",   # subprocess without shell — inputs are controlled
    "S607",   # partial executable path (git, ruff, graphify on PATH)
    "RUF012", # mutable class attrs on pydantic models are fine
    "E501",
    "ASYNC240", # small local fs ops in async code (tmp files, fixtures) — not on hot paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
